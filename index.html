<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#6366F1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
            CSP: base-uri/object-src/form-action/connect-src ditambahkan untuk hardening.
            'unsafe-inline' dipertahankan di script-src & style-src karena:
            (1) script bootstrap inline di bawah, (2) preamble React Fast Refresh
            yang disuntikkan Vite saat dev. Untuk produksi, header CSP dari server
            (dengan nonce) tetap direkomendasikan.
        -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' blob: data:; connect-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'"
    />
    <meta
      name="description"
      content="Generator warna, font, design token, dan brand kit gratis yang berjalan langsung di browser."
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <!-- SEO_PAGE_META -->
    <title>ALUSNA — Alat Warna, Tipografi & Brand Kit Gratis</title>
    <style>
      #boot-error {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        padding: 24px;
        background: #1a0b0b;
        color: #ffb4b4;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        white-space: pre-wrap;
        overflow: auto;
      }
      #boot-error h1 {
        color: #ff6b6b;
        margin: 0 0 12px;
        font-size: 16px;
      }
      #boot-loading {
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0b;
        color: #71717a;
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="boot-loading" aria-live="polite">Memuat ALUSNA…</div>
    <div id="root"></div>
    <div id="boot-error" role="alert"></div>

    <script>
      // Tangkap error saat bootstrap supaya terlihat di layar, bukan blank page.
      window.__showBootError = function (title, detail) {
        var box = document.getElementById("boot-error");
        if (!box) return;
        // Gunakan textContent (bukan innerHTML) supaya pesan error tidak
        // pernah dirender sebagai HTML/script.
        box.textContent = "";
        var h1 = document.createElement("h1");
        h1.textContent = title || "Error";
        var body = document.createElement("div");
        body.textContent = detail || "(tidak ada detail)";
        box.appendChild(h1);
        box.appendChild(body);
        box.style.display = "block";
        var loading = document.getElementById("boot-loading");
        if (loading) loading.style.display = "none";
      };
      window.addEventListener("error", function (e) {
        window.__showBootError(
          "Runtime error",
          (e.error && e.error.stack) || e.message || String(e),
        );
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        window.__showBootError(
          "Promise rejection tidak tertangani",
          (r && r.stack) || (r && r.message) || String(r),
        );
      });
      // Sembunyikan loading setelah React mount (dipanggil dari main.tsx).
      window.__hideBootLoading = function () {
        var loading = document.getElementById("boot-loading");
        if (loading) loading.style.display = "none";
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
