name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:boundaries
      - run: npm test
      - run: npm run build

      - run: npm run build:production
        env:
          VITE_SITE_URL: https://ci.alusna.dev
          VITE_CONTACT_EMAIL: ci@alusna.dev

      - run: npx playwright install --with-deps chromium
      # Accessibility gate runs FIRST so WCAG violations surface before the
      # rest of the e2e suite.
      - run: npx playwright test e2e/accessibility.spec.ts
      - run: npx playwright test
